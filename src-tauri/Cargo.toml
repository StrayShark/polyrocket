[package]
name = "polyrocket"
version = "0.1.0"
description = "Polymarket analysis desktop client"
authors = ["polyrocket"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "polyrocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tokio-retry = "0.3"
once_cell = "1"
arc-swap = "1"
rand = "0.8"
# v0.113 — Hunyuan 混元 TC3-HMAC-SHA256 签名
hmac = "0.12"
sha2 = "0.10"
tauri-plugin-notification = "2.0.0-rc.5"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# v0.76 — codegen Phase 1: tauri-specta
# Wraps `#[tauri::command]` with type info, generates
# TS bindings at build time. See docs/codegen-migration-plan.md.
# Note: `specta-typescript` MUST match the version tauri-specta
# pulls in transitively (0.0.12), or the trait `LanguageExt`
# is satisfied by a different type identity.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = { version = "0.0.12", features = ["serde"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
mockito = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
