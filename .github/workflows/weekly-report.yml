# v0.62e — weekly polyrocket report cron.
#
# Runs the full check matrix (cargo check / doc / test,
# vitest coverage, comment density, python sidecar)
# once a week and posts the result as a GitHub Actions
# job summary.
#
# Schedule: Mondays 06:00 UTC. The user can also
# trigger manually via `workflow_dispatch`.

name: weekly report

on:
  schedule:
    - cron: '0 6 * * 1'  # 06:00 UTC every Monday
  workflow_dispatch:

jobs:
  report:
    name: weekly health check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.77

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run weekly report
        run: node scripts/weekly-report.mjs >> $GITHUB_STEP_SUMMARY
