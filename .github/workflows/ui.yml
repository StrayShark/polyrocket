name: ui

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: pnpm typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Build (sanity — skips tauri bundle)
        run: pnpm build
        env:
          # Skip the tauri-cli postinstall for the pure Vite build
          CI: "true"
