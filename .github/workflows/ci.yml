# v0.57c — full CI for polyrocket.
#
# Runs the entire test matrix + all governance
# guards on every PR. Catches:
#   - L1 ↔ Tauri drift (v0.32a)
#   - L1 ↔ L2 layer violations (v0.42e-1)
#   - doc sync drift (v0.42a — staged files must
#     have a matching polyrocket-*.md / overview.md
#     change)
#   - TypeScript compile errors
#   - vitest unit tests (L1)
#   - cargo lib tests (Rust)
#   - python sidecar tests
#
# The workflows are split so the cheap guards
# (L1↔Tauri, doc-sync, layer-check) run in <30s
# and the expensive tests (cargo + vitest +
# typecheck) run in parallel after.

name: polyrocket CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'sidecar/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]

jobs:
  # ============================================================
  # Cheap governance guards. Run first; fail fast.
  # ============================================================
  guards:
    name: governance guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: L1↔Tauri guard
        run: node scripts/check-l1-tauri.mjs

      - name: Layer rules
        run: node scripts/check-layers.mjs

      - name: 3-theme contrast (WCAG AA)
        run: node scripts/check-theme-contrast.mjs

      # v0.42a — doc-sync. Stages any files in
      # src/ or src-tauri/ and verifies a
      # matching docs/ change exists in the
      # same commit. Skipped when nothing is
      # staged (i.e. on a clean checkout of
      # main after merge).

      # v0.61k — comment density check. Fails
      # if <50% of files in any of 5 categories
      # (rust-commands-domain-infra, rust-platform,
      # ts-routes-components-lib, ts-types, py-sidecar)
      # meet the density target. See
      # docs/coding-spec.md §5 and §6.
      - name: comment density (v0.61k)
        run: node scripts/check-comment-density.mjs

      # v0.67d — README badges sync moved to the
      # `frontend` job (right after `pnpm test:coverage`)
      # because it requires `coverage/coverage-summary.json`
      # which is generated by that step. v0.69e — moved
      # because the guards job runs in parallel with
      # frontend and the json didn't exist yet at sync time.

  # ============================================================
  # TypeScript + vitest (L1).
  # ============================================================
  frontend:
    name: L1 typecheck + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: vitest
        run: pnpm test

      - name: vitest coverage gate
        run: pnpm test:coverage

      # v0.67d — README badges must match actuals.
      # The auto-update script is idempotent; we run
      # it in dry-run mode and fail if it would
      # produce a diff. Maintainer runs the script
      # locally + commits the resulting README/overview
      # changes (we don't auto-commit because the
      # project is local-only push — see user.md).
      #
      # v0.69e — moved from the `governance guards` job
      # (where it originally lived, but the coverage-
      # summary.json didn't exist yet because that job
      # ran in parallel). Now it sits right after
      # `pnpm test:coverage` so coverage data is fresh.
      - name: README badges in sync (v0.67d)
        run: |
          if node scripts/update-readme-coverage.mjs 2>&1 | grep -q "no changes needed"; then
            echo "README badges are in sync with current actuals ✓"
          else
            echo "❌ README.md or docs/overview.md is out of sync."
            echo "Run: node scripts/update-readme-coverage.mjs locally,"
            echo "review the diff, and commit."
            exit 1
          fi

      # v0.68c — clean coverage/ between runs to avoid
      # stale HTML diffing. coverage/ is in .gitignore
      # (v0.63b) but the runner doesn't clean it; without
      # this step a partial coverage run can leave stale
      # files that don't reflect current actuals.
      - name: clean stale coverage output
        if: always()
        run: rm -rf coverage

  # ============================================================
  # Rust cargo tests.
  # ============================================================
  rust:
    name: Rust cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # v0.69f — Tauri 2 webkit2gtk-4.1 / glib / gtk / soup3
      # native bindings need system libs. ubuntu-latest image
      # ships none of these. Before v0.69's Rust toolchain bump
      # (1.77→1.89) the build failed earlier (edition2024) so
      # we never got far enough to discover this — dlopen2_derive
      # manifest parse was masking the glib-sys pkg-config miss.
      # Standard Tauri CI recipe from
      # https://v2.tauri.app/start/prerequisites/#linux.
      - name: Install Linux system deps (webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # v0.82 — bumped from 1.89 to 1.96. Reason: specta 2.0.0-
          # rc.25 (added in v0.76 codegen) uses `core::fmt::from_fn`
          # gated behind `debug_closure_helpers`, which stabilized
          # in Rust 1.96. Older toolchains emit E0658. Pinning to
          # the current latest stable keeps local + CI in lockstep.
          toolchain: 1.96

      # v0.69g — tauri::generate_context!() macro reads
      # `../dist/index.html` at compile time (tauri.conf.json
      # `build.frontendDist`). cargo build --lib / cargo test
      # --lib don't actually need the real Vite bundle, but
      # the macro panics if dist/ is missing. Placeholder
      # index.html with the bare minimum the macro needs
      # (root div + script tag pointing to nonexistent JS,
      # which is fine — the lib only reads metadata, not
      # the bundle contents).
      - name: stub dist/ for tauri::generate_context!()
        run: |
          mkdir -p dist/assets
          cat > dist/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>polyrocket</title></head><body><div id="root"></div><script type="module" src="/assets/main.js"></script></body></html>
          EOF
          echo "console.log('stub')" > dist/assets/main.js

      - name: cargo build
        run: cd src-tauri && cargo build --lib

      - name: cargo test (lib)
        run: cd src-tauri && cargo test --lib -- --test-threads=1

  # ============================================================
  # Python sidecar tests.
  # ============================================================
  python:
    name: Python sidecar tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        working-directory: sidecar
        run: pip install -e . pytest

      - name: pytest
        working-directory: sidecar
        run: pytest

  # ============================================================
  # Playwright e2e (v0.82 — Visual Acceptance Gate).
  #
  # Spec: docs/coding-spec.md §12. Catches both DOM and CSS
  # regressions in the /bankroll route (and any other future
  # route under tests/e2e/).
  #
  # Browser: Playwright's bundled chromium (no executablePath
  # override — the macOS dev shortcut via puppeteer's cache is
  # handled in `playwright.config.ts` resolveChromiumPath() and
  # is not used on Linux runners).
  #
  # Why this is a separate job: the Vite dev server + chromium
  # process needs ~60s to warm up, and visual diffs are noisy
  # if bundled with typecheck or cargo. Splitting keeps each
  # job's failure mode clean.
  # ============================================================
  e2e:
    name: Playwright e2e (visual regression)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # v0.82 — Playwright needs its own chromium on Linux runners
      # (the macOS puppeteer cache trick from `playwright.config.ts`
      # only applies to local dev). `--with-deps` installs the OS
      # shared libraries chromium needs (libnss3, libatk-1.0, etc.)
      # that aren't in the ubuntu-latest image.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      # v0.82 — on failure, upload the test report + diff PNGs so
      # the PR author can see which route/theme regressed without
      # rerunning locally. Playwright HTML reporter writes to
      # `playwright-report/` by default.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/**/*-actual.png
            test-results/**/*-diff.png
            test-results/**/test-failed-1.png
          retention-days: 7
