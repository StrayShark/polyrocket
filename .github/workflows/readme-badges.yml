# v0.68d — Auto-PR README badge sync.
#
# Workflow that runs `scripts/update-readme-coverage.mjs`
# weekly and on workflow_dispatch, then opens a PR if
# the README / overview files would change.
#
# Why PR-based (not direct push to main):
#   - The project is local-only push (see user.md).
#   - We want a human to review badge changes before
#     they land.
#   - The PR gives the maintainer a chance to verify
#     the diff is what they expected.
#
# Triggers:
#   - workflow_dispatch: manual run from the Actions tab
#   - schedule: every Monday 06:00 UTC (after the
#     weekly-report cron which runs at 06:00 too)
#
# Permissions: contents=write is required to push the
# auto-PR branch.

name: README badge auto-sync

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:30 UTC (30 min after the
    # weekly-report cron). Generates the diff.
    - cron: '30 6 * * 1'

jobs:
  sync-badges:
    name: Update README + overview badges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # We need write access for the auto-PR.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate the diff. The script writes updated
      # README.md + docs/overview.md in place if
      # actuals have drifted.
      - name: Run coverage script
        run: |
          # First make sure we have a coverage report.
          pnpm test:coverage
          # Then ask the script to bump badges.
          # We don't pass --version here because we
          # don't want this workflow to bump versions;
          # that's a maintainer-only decision.
          node scripts/update-readme-coverage.mjs

      - name: Check for diff
        id: check-diff
        run: |
          if git diff --quiet README.md docs/overview.md; then
            echo "No badge changes needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Badge updates available"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Use peter-evans/create-pull-request to open
      # a PR with the auto-generated diff.
      - name: Open auto-PR
        if: steps.check-diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'auto: README badge sync (v0.68d)'
          title: 'Auto: README badge sync'
          body: |
            Auto-generated badge sync from `scripts/update-readme-coverage.mjs`.

            Review the diff below. Merge if correct.

            ```
            $(git diff --stat)
            ```
          branch: auto/readme-badges
          delete-branch: true
          # Don't auto-assign reviewers — let the maintainer pick.
