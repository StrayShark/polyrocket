# v0.38a — Visual snapshot diff on every PR
#
# This workflow runs on every PR and posts a
# comment if any PNGs in docs/previews/ have
# changed since the base branch.
#
# It uses the project's own diff-snapshots.mjs
# tool (v0.35a) to do the byte-level diff. The
# snapshots themselves are generated by
# snapshot_pages.py (which uses Playwright).
#
# The workflow:
# 1. Sets up Python + Playwright
# 2. Generates fresh snapshots
# 3. Compares against the base branch snapshots
#    using diff-snapshots.mjs
# 4. Posts a PR comment with the diff (if any)
# 5. Sets a "visual-changes" output (read by
#    subsequent jobs if needed)

name: Visual snapshot diff

on:
  pull_request:
    paths:
      - 'docs/previews/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'sidecar/**'
      - 'scripts/snapshot_pages.py'
      - 'scripts/diff-snapshots.mjs'
      - 'scripts/snapshot_diff.yml'

jobs:
  diff-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the base branch so we can diff
          # against it
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Generate fresh snapshots
        run: |
          mkdir -p /tmp/snapshots-current
          python scripts/snapshot_pages.py 2>&1 | tail -10
          # The script writes to docs/previews/;
          # move to /tmp for the diff step
          cp -r docs/previews/* /tmp/snapshots-current/

      - name: Restore base branch snapshots
        run: |
          mkdir -p /tmp/snapshots-base
          # Use git show to extract the base branch's
          # docs/previews/. The PR target branch is
          # ${{ github.base_ref }}.
          git show "origin/${{ github.base_ref }}:docs/previews/dark/dashboard.png" > /dev/null 2>&1 || true
          # If the base branch has the dir, copy it
          if git show "origin/${{ github.base_ref }}:docs/previews/dark/dashboard.png" > /dev/null 2>&1; then
            mkdir -p /tmp/snapshots-base
            for f in $(git ls-tree -r --name-only "origin/${{ github.base_ref }}" -- docs/previews/); do
              git show "origin/${{ github.base_ref }}:$f" > "/tmp/$f"
            done
          fi

      - name: Run byte-level diff
        id: diff
        run: |
          if [ -d /tmp/snapshots-base ] && [ -d /tmp/snapshots-current ]; then
            node scripts/diff-snapshots.mjs /tmp/snapshots-base /tmp/snapshots-current > /tmp/diff.txt 2>&1
            DIFF_EXIT=$?
            cat /tmp/diff.txt
            if [ $DIFF_EXIT -eq 1 ]; then
              echo "visual-changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "visual-changes=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No base branch snapshots; skipping diff"
            echo "visual-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment if visual changes
        if: steps.diff.outputs.visual-changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/diff.txt', 'utf8');
            const body = `## 🎨 Visual snapshot diff\n\n\`\`\`\n${diff}\n\`\`\`\n\n_Generated by [diff-snapshots.mjs](https://github.com/${{ github.repository }}/blob/${{ github.head_ref }}/scripts/diff-snapshots.mjs)_`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
